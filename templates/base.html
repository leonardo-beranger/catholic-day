<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo_documento}}</title>
  <meta name="description" content="{{descricao}}">
  <link rel="canonical" href="{{url_canonica}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap">
  <link rel="icon" href="/img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/logo.png">
  <link rel="stylesheet" href="/estatico/css/estilos.css">
  <script>window.BASE_PATH = "{{base_path}}";</script>
</head>
<body class="{{classe_pagina}}">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <header class="cabecalho">
    <div class="container cabecalho__linha">
      <a class="marca" href="/">
        <img class="marca__simbolo" src="/img/logo.png" alt="" width="40" height="40" decoding="async">
        <span class="marca__texto">
          <strong>Catholic Day</strong>
        </span>
      </a>

      <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu-principal">
        <span class="menu-botao__barras" aria-hidden="true"></span>
        <span class="sr">Abrir menu</span>
      </button>

      <nav class="menu" id="menu-principal" aria-label="Navegação principal">
{{menu}}
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <div class="container">
      <header class="pagina-cabecalho">
        <h1>{{titulo}}</h1>
        <p class="pagina-cabecalho__subtitulo">{{subtitulo}}</p>
      </header>

{{conteudo}}
    </div>
  </main>

  <footer class="rodape">
    <div class="container">
      <nav class="menu menu--rodape" aria-label="Navegação do rodapé">
{{menu}}
      </nav>
      <p class="rodape__nota">
        Catholic Day — conteúdo em construção, fiel ao Magistério da Igreja Católica.
        <br>
        <em>Ad maiorem Dei gloriam.</em>
      </p>
    </div>
  </footer>

  <script src="/estatico/js/principal.js"></script>
  {{scripts}}
</body>
</html>
